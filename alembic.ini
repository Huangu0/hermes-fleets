[alembic]
script_location = src/hermes_fleet/db/migrations
# URL is taken from FLEET_DB_URL by env.py when set
sqlalchemy.url = sqlite:///./data/fleet.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
