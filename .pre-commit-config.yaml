# Local hooks only (no network at commit time). Install: `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: secret / forbidden-file scan (public repo)
        entry: uv run python scripts/check_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: just-check
        name: just check (ruff + mypy + pytest -m "not e2e")
        entry: just check
        language: system
        pass_filenames: false
        always_run: true
